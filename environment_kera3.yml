name: dl4rl-k3
channels:
  - defaults
  - conda-forge
  - pytorch
dependencies:
  - openblas
  - python=3.12.13
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - matplotlib
  - tqdm=4.59.0
  - jupyterlab
  - seaborn
  - setuptools<81  # hyperopt imports pkg_resources  
  - pip>=24.2
  - pip:
      # Keras 3 stack
      - tensorflow==2.20.0
      - keras==3.13.2
      # hyperparameter search
      - keras-tuner==1.4.8
      - keras-hypetune==0.2.1
      - hyperopt==0.2.5  # the version keras-hypetune runs with      
      - statannotations==0.5.0
      - torchvision 
      - jupyter_contrib_nbextensions
      - sacrebleu
      - timeout_decorator  
      - papermill==2.7.0  # runs the training notebook for each feature set and budget      
